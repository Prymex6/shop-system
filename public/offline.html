<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brak połączenia</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 48px 32px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      .icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      p {
        color: #6b7280;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      button {
        background: #dc2626;
        color: #fff;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
      }
      button:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Brak połączenia</h1>
      <p>Nie możemy połączyć się z restauracją. Sprawdź połączenie internetowe i spróbuj ponownie.</p>
      <button onclick="location.reload()">Spróbuj ponownie</button>
    </div>
  </body>
</html>
